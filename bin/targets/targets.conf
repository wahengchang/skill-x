# Target registry for bin/build.sh.
#
# This file is the contract between the shared canonical build path
# (commands-src/ -> commands/) and the per-target adapters that emit
# transformed artifact trees. It is sourced by bin/build.sh to drive the
# adapter loop and the atomic swap, and by tests/run.sh to assert that
# every adapter in bin/targets/ is declared here.

# Canonical artifact directory produced by the shared build path.
# Everything in CANONICAL_CONSUMERS below reads
# commands/<name>/SKILL.md verbatim, with no format change. Distribution
# from this directory to the on-disk skill paths is owned by
# bin/sync-skills.sh (personal machines) and bin/cloud-bootstrap.sh
# (pinned images), not by bin/build.sh.
CANONICAL_DEST="commands"
CANONICAL_CONSUMERS=(
  "claude-code:~/.claude/skills"
  "codex:~/.codex/skills"
  "codex-defensive:~/.agents/skills"
  "opencode-v2:~/.config/opencode/skills"
)

# Transformed artifacts require an adapter to convert the canonical
# SKILL.md into the consumer's on-disk wire format. Each entry is
# "<adapter-script-stem>:<artifact-directory-under-repo-root>":
#   - the adapter script must live at bin/targets/<adapter>.sh and
#     accept the canonical source directory and the staging artifact
#     directory as positional arguments.
#   - the artifact directory is generated and listed in .gitignore.
TRANSFORMED_TARGETS=(
  "opencode-v1-commands:opencode-commands"
)
